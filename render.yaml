services:
  - type: web
    name: beere-kesava-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Set these in the Render dashboard (never commit real values):
      #   DATABASE_URL   — Supabase pooler connection string (transaction mode)
      #   DIRECT_URL     — Supabase pooler connection string (session mode, for migrations)
      #   JWT_SECRET     — long random string; the app refuses to boot in
      #                    production without this set (see auth.module.ts)
      #   CORS_ORIGIN    — your Vercel frontend URL(s), comma-separated and
      #                    exact-match, e.g.
      #                    https://beere-kesava.vercel.app,https://www.yourdomain.com
      #                    Include any custom domain and, if you need previews to
      #                    reach this API, each preview URL. No trailing slash.
      #   AISENSY_API_KEY — AiSensy campaign API key (WhatsApp sending).
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # Cloudflare R2 object storage. Without these four the backend silently
      # falls back to local-disk uploads, which this plan cannot persist (see
      # the note below) — every uploaded photo, signature and receipt would be
      # lost on the next deploy. R2_ACCOUNT_ID and R2_BUCKET are not secret,
      # but they stay dashboard-managed so all four move together.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      # Optional: overrides https://<account-id>.r2.cloudflarestorage.com
      - key: R2_ENDPOINT
        sync: false
      # Optional: public bucket / custom-domain origin (e.g. https://cdn.example.com).
      # Unset, reads are served as 1-hour presigned URLs instead.
      - key: R2_PUBLIC_BASE_URL
        sync: false
      # --- WhatsApp notifications via AiSensy ---
      # AISENSY_API_KEY is the only secret here; the rest are plain config and
      # are checked in so a fresh deploy behaves the same as local.
      - key: AISENSY_API_KEY
        sync: false
      - key: AISENSY_API_URL
        value: https://backend.aisensy.com/campaign/t1/api/v2
      - key: AISENSY_SENDER_NAME
        value: Beere Kesava Silks
      # Kill switch — set to "false" to log instead of sending.
      - key: WHATSAPP_ENABLED
        value: "true"
      # Country code prefix for the 10-digit numbers stored in the DB.
      - key: WHATSAPP_DEFAULT_COUNTRY_CODE
        value: "91"
    # NOTE: free-tier Render services don't support persistent disks, so there
    # is no 'uploads' disk mount here and backend/uploads/ is wiped on every
    # deploy and on free-tier spin-down. That no longer matters as long as the
    # R2_* vars above are set: uploads go to Cloudflare R2 and local disk is
    # only the fallback for local development (see common/storage/storage.service.ts).
