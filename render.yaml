services:
  - type: web
    name: beere-kesava-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Set these in the Render dashboard (never commit real values):
      #   DATABASE_URL   — Supabase pooler connection string (transaction mode)
      #   DIRECT_URL     — Supabase pooler connection string (session mode, for migrations)
      #   JWT_SECRET     — long random string; the app refuses to boot in
      #                    production without this set (see auth.module.ts)
      #   CORS_ORIGIN    — your deployed frontend's URL(s), comma-separated
      #                    (e.g. https://your-app.vercel.app). Leave unset
      #                    only for a throwaway/staging deploy.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
    # NOTE: free-tier Render services don't support persistent disks, so the
    # 'uploads' disk mount is removed here. backend/uploads/ (signature +
    # photo files) will be wiped on every deploy and on free-tier spin-down.
    # This is fine for testing, but move uploads to object storage (S3 /
    # Supabase Storage) before relying on this in real production use — or
    # switch back to plan: starter with a disk mount (see git history).
