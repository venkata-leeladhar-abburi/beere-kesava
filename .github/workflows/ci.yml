name: CI

# Phase-1 quality gate for the frontend. Every job must be green before a
# PR can merge - branch protection should require this workflow as a
# required check. See frontend/tsconfig.strict.json and frontend/eslint.config.js
# for what each job actually enforces and why some rules are still warnings.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: frontend

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck (baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  typecheck-strict:
    # Blocking. `include` in frontend/tsconfig.strict.json lists src/lib,
    # src/hooks and src/contexts, but TypeScript also checks everything those
    # roots import, and contexts/index.ts re-exports most of src/features - so
    # this covers far more than the allowlist suggests. That transitive backlog
    # was cleared to 0 on 7 Oct 2026, which is what let this stop being
    # informational: a strict error anywhere in that surface now fails CI.
    name: Typecheck (strict ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck:strict

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  format:
    # Informational only, not part of the Phase-1 gate: 211 pre-existing files
    # don't match the Prettier config yet. Mass-reformatting them is a
    # deliberate follow-up (its own PR, reviewed as a no-behavior-change diff)
    # rather than something to fold silently into this change. New/touched
    # files are expected to be Prettier-clean going forward.
    name: Format check (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test

  design-system:
    # BK Loom design-system gates (design-system/01-FOUNDATIONS.md onward).
    # check:contrast fails if any token pair regresses below its required
    # WCAG ratio; check:tokens fails if the CSS and TS token mirrors drift
    # apart. Both are cheap, deterministic, and specifically close the class
    # of bug that shipped #8B7060 (a 4.11:1 label colour) across the app.
    name: Design system (contrast + token drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check:contrast
      - run: npm run check:tokens

  build:
    name: Build + bundle size
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check-bundle-size
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: frontend/dist
          retention-days: 7

  # -
  # Backend gate. Until this existed the backend never ran in CI at all: a
  # broken Nest build, a bad Prisma schema, or a regressed auth guard could
  # merge to main with zero signal.
  #
  # No Postgres service here on purpose - every current backend spec mocks
  # PrismaService, so a database would sit idle and slow the job down. A
  # real Postgres arrives with the Testcontainers integration suite.
  #
  # `prisma generate` is mandatory, not optional: src/generated/prisma is
  # gitignored, so nothing typechecks or compiles on a fresh checkout until
  # the client is emitted.
  # -
  backend:
    name: Backend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  # -
  # The backend against a real Postgres: the integration specs boot the whole
  # Nest app and drive it over HTTP (test/integration). They cover what the
  # mocked unit specs cannot: Decimal money columns, the session lookup on
  # every request, and the unique-index claims that stop a scheduled job or
  # an invoice payment from running twice.
  # -
  backend-integration:
    name: Backend integration (real Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Write .env.test
        # Read by test/utils/global-setup.ts and test-app.ts. Every value is a
        # throwaway: the database is this job's own container, WhatsApp is
        # off, and R2 is never called.
        run: |
          cat > .env.test <<'ENV'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
          DIRECT_URL=postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
          NODE_ENV=test
          PORT=3000
          E2E_TEST_MODE=true
          JWT_SECRET=ci-integration-secret
          CORS_ORIGIN=http://localhost:5175
          WHATSAPP_ENABLED=false
          READ_CACHE_ENABLED=false
          R2_ACCOUNT_ID=ci
          R2_ACCESS_KEY_ID=ci
          R2_SECRET_ACCESS_KEY=ci
          R2_BUCKET=ci
          R2_ENDPOINT=http://localhost:9
          ENV
      - run: npm run test:integration

  # -
  # Playwright through the real UI, production build, real backend, real
  # database. Logs in via the OTP flow (the backend's E2E_TEST_MODE exposes
  # the code), so it catches a broken login before a deploy does.
  # -
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, build]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend - install, migrate, seed, build
        working-directory: backend
        run: |
          npm ci
          npx prisma migrate deploy
          npx ts-node -O '{"module":"commonjs","target":"ES2021","esModuleInterop":true}' prisma/seed.ts
          npx ts-node -O '{"module":"commonjs","target":"ES2021","esModuleInterop":true}' prisma/seed-test-users.ts
          npm run build

      - name: Backend - start
        working-directory: backend
        env:
          NODE_ENV: development
          PORT: "3000"
          E2E_TEST_MODE: "true"
          JWT_SECRET: ci-e2e-secret
          CORS_ORIGIN: http://localhost:5175
          WHATSAPP_ENABLED: "false"
          READ_CACHE_ENABLED: "false"
          R2_ACCOUNT_ID: ci
          R2_ACCESS_KEY_ID: ci
          R2_SECRET_ACCESS_KEY: ci
          R2_BUCKET: ci
          R2_ENDPOINT: http://localhost:9
        run: |
          nohup node dist/main.js > ../backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/health && exit 0; sleep 1; done
          cat ../backend.log; exit 1

      - name: Frontend - build and serve
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:3000
        run: |
          npm ci
          npm run build
          nohup npx vite preview --port 5175 --strictPort > ../frontend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5175 >/dev/null && exit 0; sleep 1; done
          cat ../frontend.log; exit 1

      - name: Playwright
        working-directory: frontend
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          E2E_BASE_URL: http://localhost:5175
          VITE_API_URL: http://localhost:3000
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Keep the report and server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            backend.log
            frontend.log
          retention-days: 7

  # -
  # Supply chain and secrets. Both are cheap and catch a class of problem no
  # amount of unit testing will: a vulnerable transitive dependency, or a
  # credential pasted into a commit.
  # -
  audit:
    # Blocking: production dependencies must have no high or critical advisories.
    name: Dependency audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: npm audit (production deps, high and critical)
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan commits, not just the tree.
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
