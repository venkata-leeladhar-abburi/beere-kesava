name: CI

# Phase-1 quality gate for the frontend. Every job must be green before a
# PR can merge — branch protection should require this workflow as a
# required check. See frontend/tsconfig.strict.json and frontend/eslint.config.js
# for what each job actually enforces and why some rules are still warnings.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: frontend

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck (baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  typecheck-strict:
    # Informational until the transitive backlog clears, for the reason spelled
    # out in frontend/tsconfig.strict.json: `include` lists src/lib, src/hooks
    # and src/contexts, but TypeScript also checks everything those roots
    # import, and contexts/index.ts re-exports most of src/features. The
    # declared roots are strict-clean (0 errors); the ~467 that remain all come
    # in through that barrel, so this job cannot go green by fixing the
    # allowlist alone. A required check that can never pass gets routed around,
    # which is worse than an honest informational one — so it reports the
    # number without blocking. Drop continue-on-error once the count hits 0.
    name: Typecheck (strict ratchet, informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck:strict

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  format:
    # Informational only, not part of the Phase-1 gate: 211 pre-existing files
    # don't match the Prettier config yet. Mass-reformatting them is a
    # deliberate follow-up (its own PR, reviewed as a no-behavior-change diff)
    # rather than something to fold silently into this change. New/touched
    # files are expected to be Prettier-clean going forward.
    name: Format check (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test

  design-system:
    # BK Loom design-system gates (design-system/01-FOUNDATIONS.md onward).
    # check:contrast fails if any token pair regresses below its required
    # WCAG ratio; check:tokens fails if the CSS and TS token mirrors drift
    # apart. Both are cheap, deterministic, and specifically close the class
    # of bug that shipped #8B7060 (a 4.11:1 label colour) across the app.
    name: Design system (contrast + token drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check:contrast
      - run: npm run check:tokens

  build:
    name: Build + bundle size
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check-bundle-size
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: frontend/dist
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────
  # Backend gate. Until this existed the backend never ran in CI at all: a
  # broken Nest build, a bad Prisma schema, or a regressed auth guard could
  # merge to main with zero signal.
  #
  # No Postgres service here on purpose — every current backend spec mocks
  # PrismaService, so a database would sit idle and slow the job down. A
  # real Postgres arrives with the Testcontainers integration suite.
  #
  # `prisma generate` is mandatory, not optional: src/generated/prisma is
  # gitignored, so nothing typechecks or compiles on a fresh checkout until
  # the client is emitted.
  # ───────────────────────────────────────────────────────────────────────
  backend:
    name: Backend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  # ───────────────────────────────────────────────────────────────────────
  # Supply chain and secrets. Both are cheap and catch a class of problem no
  # amount of unit testing will: a vulnerable transitive dependency, or a
  # credential pasted into a commit.
  # ───────────────────────────────────────────────────────────────────────
  audit:
    # Informational, not yet a gate: the tree currently carries a backlog of
    # pre-existing advisories (see docs/TESTING_PLAN.md Â§ Phase 0 findings).
    # Landing this job red would train people to ignore a red X, which is
    # worse than no job. Flip continue-on-error off once the backlog is
    # cleared â that flip is the Phase-0 exit criterion for supply chain.
    name: Dependency audit (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: npm audit (high and critical only)
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan commits, not just the tree.
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
