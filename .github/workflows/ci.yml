name: CI

# Phase-1 quality gate for the frontend. Every job must be green before a
# PR can merge — branch protection should require this workflow as a
# required check. See frontend/tsconfig.strict.json and frontend/eslint.config.js
# for what each job actually enforces and why some rules are still warnings.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: frontend

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck (baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  typecheck-strict:
    name: Typecheck (strict ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck:strict

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  format:
    # Informational only, not part of the Phase-1 gate: 211 pre-existing files
    # don't match the Prettier config yet. Mass-reformatting them is a
    # deliberate follow-up (its own PR, reviewed as a no-behavior-change diff)
    # rather than something to fold silently into this change. New/touched
    # files are expected to be Prettier-clean going forward.
    name: Format check (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test

  design-system:
    # BK Loom design-system gates (design-system/01-FOUNDATIONS.md onward).
    # check:contrast fails if any token pair regresses below its required
    # WCAG ratio; check:tokens fails if the CSS and TS token mirrors drift
    # apart. Both are cheap, deterministic, and specifically close the class
    # of bug that shipped #8B7060 (a 4.11:1 label colour) across the app.
    name: Design system (contrast + token drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check:contrast
      - run: npm run check:tokens

  build:
    name: Build + bundle size
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check-bundle-size
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: frontend/dist
          retention-days: 7
