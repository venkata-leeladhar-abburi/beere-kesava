name: Keep backend awake

# Render's free plan stops the service after ~15 minutes without traffic, and
# the next request then waits 30-60s. A ping every 10 minutes avoids that.
# Set the repo variable RENDER_HEALTH_URL (Settings > Secrets and variables >
# Actions > Variables), e.g. https://beere-kesava.onrender.com/health.
# Skipped when the variable is not set. GitHub may delay scheduled runs by a few
# minutes, so also point a free uptime monitor (UptimeRobot) at the same URL.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.RENDER_HEALTH_URL != '' }}
    steps:
      - name: Ping /health
        run: curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 10 "${{ vars.RENDER_HEALTH_URL }}"
