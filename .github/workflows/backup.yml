name: Nightly database backup

# Every night at 03:00 IST: an encrypted pg_dump of the live database's
# "public" schema goes to Cloudflare R2 (backups/db/, last 30 days kept), and
# the backup just made is then restored into a throwaway Postgres to prove it
# restores. A run fails, and GitHub emails you, if any of that does not work.
#
# Setup (Settings > Secrets and variables > Actions > Secrets):
#   BACKUP_DATABASE_URL   Supabase session-mode URL (port 5432), i.e. DIRECT_URL
#   BACKUP_PASSPHRASE     long random string. Store a copy somewhere outside
#                         GitHub (a password manager): without it no backup can
#                         ever be decrypted, including by you.
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BACKUP_BUCKET
#                         a bucket for backups only, with no public access
# Skipped while BACKUP_DATABASE_URL is missing.
# Restoring by hand: docs/DEPLOY_RUNBOOK.md, "Restoring a backup".
on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_DB: ${{ secrets.BACKUP_DATABASE_URL != '' }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # Newer AWS CLIs add checksums R2 does not need; only send them when required.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
      PREFIX: backups/db
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_DB == 'true'

      - name: Dump and encrypt
        if: env.HAS_DB == 'true'
        id: dump
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        # Same postgres:17 image the restore check below uses, so pg_dump is
        # never older than the server and both sides match.
        run: |
          mkdir -p out
          file=$(docker run --rm -v "$PWD/backend/scripts:/scripts:ro" -v "$PWD/out:/out" \
            -e BACKUP_DATABASE_URL -e BACKUP_PASSPHRASE postgres:17 /scripts/db-backup.sh /out)
          name=$(basename "$file")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -la out

      - name: Upload to R2
        if: env.HAS_DB == 'true'
        run: aws s3 cp "out/${{ steps.dump.outputs.name }}" "s3://$BUCKET/$PREFIX/" --endpoint-url "$R2_ENDPOINT" --only-show-errors

      - name: Prove it restores
        if: env.HAS_DB == 'true'
        run: |
          docker network create restore-check
          docker run -d --name scratch --network restore-check -e POSTGRES_PASSWORD=postgres postgres:17
          until docker exec scratch pg_isready -U postgres -q; do sleep 1; done; sleep 2
          counts=$(docker run --rm --network restore-check -v "$PWD/backend/scripts:/scripts:ro" -v "$PWD/out:/out" \
            -e BACKUP_PASSPHRASE -e RESTORE_DATABASE_URL=postgresql://postgres:postgres@scratch:5432/postgres \
            postgres:17 /scripts/db-restore.sh "/out/${{ steps.dump.outputs.name }}")
          echo "$counts"
          users=$(echo "$counts" | awk -F'|' '$1 ~ /^ *User *$/ {gsub(/ /, "", $2); print $2}')
          if [ -z "$users" ] || [ "$users" -eq 0 ]; then
            echo "::error::Restored backup has no users; the backup is not usable."
            exit 1
          fi

      - name: Drop backups older than 30 days
        if: env.HAS_DB == 'true'
        run: |
          cutoff=$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%S)
          aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$PREFIX/" --endpoint-url "$R2_ENDPOINT" \
            --query "Contents[?LastModified<'$cutoff'].Key" --output text \
            | tr '\t' '\n' | grep -v '^None$' | grep . | while read -r key; do
                echo "deleting $key"
                aws s3 rm "s3://$BUCKET/$key" --endpoint-url "$R2_ENDPOINT" --only-show-errors
              done || true
